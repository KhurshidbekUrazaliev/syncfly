# Run with: docker compose -f compose.yaml -f compose.production.yaml up -d --build
services:
  relay:
    environment:
      RELAY_PUBLIC_URL: https://${SYNCFLY_DOMAIN:?Set SYNCFLY_DOMAIN in .env}
      RELAY_INVITE_CODE: ${RELAY_INVITE_CODE:?Generate an invitation code with scripts/configure-cloud.py}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      SYNCFLY_DOMAIN: ${SYNCFLY_DOMAIN:?Set SYNCFLY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
